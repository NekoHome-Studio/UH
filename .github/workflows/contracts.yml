name: contracts
# M3 独立复审 P2：paths 原漏 deploy/k8s、deploy/security、desktop 及其
# 对应校验脚本——单改这些目录时 contracts.yml 不触发，本地全量门禁能发现的
# 问题（J/M/L 项）在 CI 侧静默通过。
on:
  push:
    paths: ["docs/contracts/**", "deploy/k8s/**", "deploy/security/**", "deploy/observability/**", "desktop/**", "kernel/**", "tests/**", "ui/**", "examples/plugins/**", "pyproject.toml", "Dockerfile", ".dockerignore", ".env.example", "docker-compose.yaml", "scripts/validate-contracts.mjs", "scripts/review-precheck.mjs", "scripts/verify-all.mjs", "scripts/verify-compose-exposure.mjs", "scripts/verify-k8s-manifests.mjs", "scripts/verify-security-hardening.mjs", "scripts/verify-desktop.mjs", "scripts/verify-metrics-cardinality.mjs", "scripts/check-doc-links.mjs", "scripts/generate-sbom.mjs", "scripts/render-seccomp-profile.mjs", "scripts/secret-scan.mjs", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["docs/contracts/**", "deploy/k8s/**", "deploy/security/**", "deploy/observability/**", "desktop/**", "kernel/**", "tests/**", "ui/**", "examples/plugins/**", "pyproject.toml", "Dockerfile", ".dockerignore", ".env.example", "docker-compose.yaml", "scripts/validate-contracts.mjs", "scripts/review-precheck.mjs", "scripts/verify-all.mjs", "scripts/verify-compose-exposure.mjs", "scripts/verify-k8s-manifests.mjs", "scripts/verify-security-hardening.mjs", "scripts/verify-desktop.mjs", "scripts/verify-metrics-cardinality.mjs", "scripts/check-doc-links.mjs", "scripts/generate-sbom.mjs", "scripts/render-seccomp-profile.mjs", "scripts/secret-scan.mjs", ".github/workflows/contracts.yml"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install ajv + js-yaml
        run: npm install ajv@8 js-yaml@4
      - name: JSON Schema 契约校验（manifest + events，正例/负例）
        run: node scripts/validate-contracts.mjs
      - name: 交叉一致性预检（错误码/事件/枚举/链接/数量/信封/SBX）
        run: node scripts/review-precheck.mjs
      - name: OpenAPI 3.1 校验
        run: npx --yes @apidevtools/swagger-cli validate docs/contracts/openapi.yaml
      - name: AsyncAPI 2.6 校验
        run: npx --yes @asyncapi/cli validate docs/contracts/asyncapi.yaml
        env:
          CI: "true"
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python deps
        run: pip install fastapi uvicorn pytest httpx redis fakeredis pyyaml jsonschema cryptography
      - name: Install ajv + js-yaml（verify-all B2 需）
        run: npm install ajv@8 js-yaml@4
      - name: 单元测试（审查修复：CI 必须跑 pytest）
        run: python -m pytest -q
      - name: 校验官方插件源码示例
        env:
          UH_LOCAL_MODE: "1"
          UH_PLUGIN_ALLOW_UNVERIFIED: "1"
        run: |
          for plugin in web-search file db-query theme-light audit-log; do
            python -m kernel.cli plugin validate "examples/plugins/official/$plugin" --no-verify
          done
      - name: 契约门禁 verify-all --full（含运行时双向 + OpenAPI/AsyncAPI 官方解析，三审 N8）
        run: node scripts/verify-all.mjs --full
