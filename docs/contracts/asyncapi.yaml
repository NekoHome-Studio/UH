    publish:
      operationId: onClientOp
      summary: 客户端 → 服务端：subscribe / auth / ping
      message:
        oneOf:
          - name: subscribe
            title: 控制帧 subscribe
            payload:
              type: object
              additionalProperties: false
              required:
                - op
                - task_id
              properties:
                op:
                  const: subscribe
                task_id:
                  type: string
                  pattern: ^uh_task_[A-Za-z0-9]+$
                after_event_id:
                  type: integer
                  minimum: 0
                  default: 0
          - name: auth
            title: 控制帧 auth
            payload:
              type: object
