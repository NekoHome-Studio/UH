<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UH!</title>
<style>
  :root { --uh-bg-primary:#0f172a; --uh-fg-primary:#e2e8f0; --uh-accent:#60a5fa; --uh-radius:12px;
          --uh-spacing:12px; --uh-font-family:Inter,"HarmonyOS Sans SC",system-ui,sans-serif;
          --uh-bg-surface:#1e293b; --uh-fg-muted:#94a3b8; --uh-accent-text:#0f172a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--uh-bg-primary); color:var(--uh-fg-primary);
         font-family:var(--uh-font-family); min-height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; flex-wrap:wrap; gap:var(--uh-spacing); padding:16px 24px; font-weight:600; letter-spacing:.5px; color:var(--uh-accent); }
  header input, header select { background:var(--uh-bg-surface); color:var(--uh-fg-primary); border:1px solid #334155; padding:6px 10px; border-radius:8px; }
  header input { margin-left:auto; max-width:100%; width:240px; }
  header span { color:var(--uh-fg-muted); font-weight:400; font-size:13px; }
  #chat { flex:1; max-width:820px; width:100%; margin:0 auto; padding:8px 20px 120px; }
  .msg { margin:14px 0; line-height:1.6; white-space:pre-wrap; }
  .msg.user { color:var(--uh-fg-muted); }
  .msg.user::before { content:"你 › "; color:var(--uh-accent); }
  .msg.assistant { background:var(--uh-bg-surface); padding:var(--uh-spacing) 16px; border-radius:var(--uh-radius); }
  .breathing { display:inline-flex; align-items:center; gap:8px; color:#64748b; font-size:14px; margin:10px 0; }
  .breathing .dot { width:10px; height:10px; border-radius:50%; background:var(--uh-accent); animation:breathe 1.2s ease-in-out infinite; }
  @keyframes breathe { 0%,100%{opacity:.3; transform:scale(.8);} 50%{opacity:1; transform:scale(1.2);} }
  .error { padding:10px 14px; border-radius:var(--uh-radius); margin:10px 0; font-size:14px; }
  .error.USR { background:#3b2f1e; color:#fbbf24; }
  .error.KRN { background:#3b1e1e; color:#f87171; }
  .error.CAP { background:#1e2f3b; color:#38bdf8; }
  .error.MEM { background:#2a1e3b; color:#c084fc; }
  .degraded { padding:8px 14px; border-radius:var(--uh-radius); margin:10px 0; font-size:13px; background:#3b2f1e; color:#fbbf24; }
  .steps { padding:8px 14px; border-radius:var(--uh-radius); margin:10px 0; font-size:13px; background:#1e293b; color:#94a3b8; }
  .confirm { background:#1e293b; border:1px solid #f59e0b; padding:14px 16px; border-radius:var(--uh-radius); margin:12px 0; }
  .confirm-title { color:#fbbf24; font-weight:600; margin-bottom:6px; }
  .confirm-summary { color:#94a3b8; font-size:14px; margin-bottom:10px; white-space:pre-wrap; }
  .confirm button { border:none; padding:8px 18px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; margin-right:10px; }
  .confirm button.approve { background:#22c55e; color:#0f172a; }
  .confirm button.reject { background:#ef4444; color:#fff; }
  .confirm button:disabled { opacity:.5; cursor:default; }
  #bar { position:fixed; bottom:0; left:0; right:0; background:linear-gradient(transparent,var(--uh-bg-primary) 30%); padding:20px; }
  #bar .inner { max-width:820px; margin:0 auto; display:flex; gap:var(--uh-spacing); }
  #prompt { flex:1; min-width:0; background:var(--uh-bg-surface); border:1px solid #334155; color:var(--uh-fg-primary);
            padding:14px 16px; border-radius:var(--uh-radius); font-size:16px; outline:none; }
  #prompt:focus { border-color:var(--uh-accent); }
  #send { background:var(--uh-accent); color:var(--uh-accent-text); border:none; padding:0 22px; border-radius:var(--uh-radius);
          font-size:16px; font-weight:600; cursor:pointer; }
  #send:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header>UH! <span>Ultra Harness</span><input id="token" type="password" aria-label="访问 token" placeholder="访问 token（鉴权模式必填）"><select id="theme" aria-label="主题" disabled><option value="">默认主题</option></select><span id="theme-status" role="status"></span></header>
<div id="chat" aria-live="polite" role="log"></div>
<div id="bar"><div class="inner">
  <input id="prompt" placeholder="输入消息，开始对话…" autofocus autocomplete="off">
  <button id="send">发送</button>
</div></div>
<script src="/static/state-machine.js"></script>
<script src="/static/themes.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
