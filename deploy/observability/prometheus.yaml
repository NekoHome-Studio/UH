global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alert-rules.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: uh-kernel
    metrics_path: /metrics
    static_configs:
      - targets: [kernel:8080]
