---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: uh-crewai, namespace: uh-prod }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: uh-crewai }
  # A zero target suspends this CPU HPA until the kernel scaler wakes it.
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
