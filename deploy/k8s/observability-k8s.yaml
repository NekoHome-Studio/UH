# M3-3/M3-4 K8s 侧可观测性（二轮复检阻断②）：Prometheus 抓取 + OTel Collector 放行
apiVersion: v1
kind: Service
metadata:
  name: uh-kernel-metrics
  namespace: uh-prod
  labels: { app: uh-kernel }
  annotations:
    # 2026-11-28 审计：Service 建了但没有任何抓取配置，Prometheus 侧完全
    # 不知道它存在——「指标可观测」在 K8s 上并未接通。补标准 scrape 注解
    # （prometheus-operator 与无 operator 两种形态都可用）。
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  selector: { app: uh-kernel }
  ports: [{ name: metrics, port: 9090, targetPort: 8080 }]
---
# ServiceMonitor 说明：它属于 prometheus-operator 的 CRD，未安装 operator 的集群
# 直接 apply 会报 no matches for kind。因此本仓库不携带该资源，改用上面 Service 的
# prometheus.io/* 注解——这是 Prometheus 官方支持的静态发现方式，两种形态都能用。
# 若集群已装 operator，可自行添加；字段等价于：
#   spec.selector.matchLabels.app: uh-kernel
#   spec.endpoints: [{port: metrics, interval: 30s, path: /metrics}]

apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: uh-prod
  labels: { app: otel-collector }
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
---
# OTel Collector Deployment（最小版，OTLP 收 → 日志落盘 + 指标透传）
apiVersion: apps/v1
kind: Deployment
metadata: { name: otel-collector, namespace: uh-prod, labels: { app: otel-collector } }
spec:
  replicas: 1
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      # 独立审查 P1-4：辅助工作负载此前无 securityContext，且 J/M 门禁不校验它，
      # 可被赋予 privileged + hostNetwork + uh-scaler SA 而全绿。现与业务工作负载同口径加固。
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: collector
          # M3 独立复审 P1：固定版本——latest 浮动不可复现，且新版已移除 logging exporter。
          image: otel/opentelemetry-collector-contrib:0.115.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports: [{ containerPort: 4317 }, { containerPort: 4318 }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/otelcol-contrib/config.yaml, subPath: config.yaml }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: otel-collector-config }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: otel-collector-config, namespace: uh-prod }
data:
  config.yaml: |
    receivers:
      otlp:
        protocols: { grpc: { endpoint: 0.0.0.0:4317 }, http: { endpoint: 0.0.0.0:4318 } }
    processors:
      batch: {}
    exporters:
      # M3 独立复审 P1：logging exporter 自 v0.111.0 移除（上游 issue #11337），
      # 沿用会让 collector 加载 pipeline 失败。改用官方替代 debug。
      debug: { verbosity: normal }
    service:
      pipelines:
        traces: { receivers: [otlp], processors: [batch], exporters: [debug] }
