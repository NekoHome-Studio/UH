# External-injection template. Render to stdin before applying.
apiVersion: v1
kind: Secret
metadata: { name: uh-runtime, namespace: uh-prod }
type: Opaque
stringData:
  DB_PASSWORD: "${DB_PASSWORD}"
  UH_LLM_API_KEY: "${UH_LLM_API_KEY}"
  UH_CLIENT_ID_SECRET: "${UH_CLIENT_ID_SECRET}"
  UH_MEMORY_MASTER_KEY: "${UH_MEMORY_MASTER_KEY}"
  uh_auth_token: "${UH_AUTH_TOKEN}"
  uh_plugin_trusted_keys: "${UH_PLUGIN_TRUSTED_KEYS}"
