apiVersion: apps/v1
kind: Deployment
metadata:
  name: uh-crewai
  namespace: uh-prod
  labels: { app: uh-crewai, tier: capability }
spec:
  replicas: 0
  selector:
    matchLabels: { app: uh-crewai, tier: capability }
  template:
    metadata:
      labels: { app: uh-crewai, tier: capability }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: Localhost, localhostProfile: uh/seccomp.json }
      volumes:
        - { name: tmp, emptyDir: { medium: Memory, sizeLimit: 128Mi } }
      terminationGracePeriodSeconds: 10
      containers:
        - name: crewai
          image: ultra-harness/crewai:0.1.0
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 0
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          env:
            - { name: UH_LLM_PROVIDER, value: mock }
            - { name: UH_LLM_BASE_URL, value: "https://api.openai.com/v1" }
            - { name: UH_LLM_MODEL, value: gpt-4o-mini }
            - name: UH_LLM_API_KEY
              valueFrom:
                secretKeyRef: { name: uh-runtime, key: UH_LLM_API_KEY }
