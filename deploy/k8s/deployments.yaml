apiVersion: apps/v1
kind: Deployment
metadata:
  name: uh-kernel
  namespace: uh-prod
  labels: { app: uh-kernel, tier: kernel }
spec:
  replicas: 2
  selector:
    matchLabels: { app: uh-kernel, tier: kernel }
  template:
    metadata:
      labels: { app: uh-kernel, tier: kernel }
    spec:
      serviceAccountName: uh-scaler
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: Localhost, localhostProfile: uh/seccomp.json }
      containers:
        - name: kernel
          image: ultra-harness/kernel:0.1.0
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            # /ready reports Redis failures in the response body with HTTP 200.
            exec:
              command:
                - python
                - -c
                - |
                  import json
                  from urllib.request import urlopen
                  with urlopen("http://127.0.0.1:8080/ready", timeout=1) as response:
                      raise SystemExit(0 if json.load(response)["status"] == "ok" else 1)
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          env:
            - { name: UH_LLM_PROVIDER, value: mock }
            - { name: UH_LLM_BASE_URL, value: "https://api.openai.com/v1" }
            - { name: UH_LLM_MODEL, value: gpt-4o-mini }
            - name: UH_LLM_API_KEY
              valueFrom:
                secretKeyRef: { name: uh-runtime, key: UH_LLM_API_KEY }
            - { name: UH_REDIS_URL, value: "redis://redis:6379" }
            - { name: UH_RETRIEVAL_BACKEND, value: chroma }
            - { name: UH_RETRIEVAL_CHROMA, value: "http://chroma:8000" }
            - { name: UH_RETRIEVAL_MCP_URL, value: "http://uh-llama-index:8080/mcp" }
            - { name: UH_ORCHESTRATION_MCP_URL, value: "http://uh-langgraph:8080/mcp" }
            - { name: UH_CHECKPOINT_BACKEND, value: postgres }
            - { name: UH_CHECKPOINT_POSTGRES_URL, value: "postgresql://uh@postgres:5432/uh_checkpoints" }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: uh-runtime, key: DB_PASSWORD }
            - { name: UH_LOCAL_MODE, value: "0" }
            - { name: UH_AUTH_REQUIRED, value: "1" }
            - { name: UH_AUTH_TOKEN_FILE, value: /run/secrets/uh_auth_token }
            - name: UH_CLIENT_ID_SECRET
              valueFrom:
                secretKeyRef: { name: uh-runtime, key: UH_CLIENT_ID_SECRET }
            - name: UH_MEMORY_MASTER_KEY
              valueFrom:
                secretKeyRef: { name: uh-runtime, key: UH_MEMORY_MASTER_KEY }
            - { name: UH_PLUGIN_TRUSTED_KEYS_FILE, value: /run/secrets/uh_plugin_trusted_keys }
            - { name: UH_PLUGIN_ROOT, value: /app/.uh/plugins }
            - { name: UH_SANDBOX_OCI_STRICT, value: "1" }
            # 二轮复检阻断③：注入委派 cgroup root，否则 PluginCgroup 不可用、
            # pids.max 防 fork 炸弹落空（仅剩 ulimit -v 内存限制）。
            - { name: UH_SANDBOX_CGROUP_ROOT, value: /sys/fs/cgroup/uh-plugins }
            # 二轮复检阻断②：OTel 指向同 ns 的 collector（netpol 已放行 4317/4318）
            - { name: UH_OTEL_ENABLED, value: "1" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4317" }
            - { name: UH_OTEL_SAMPLE_RATIO, value: "0.1" }
          volumeMounts:
            - { name: runtime, mountPath: /run/secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: state, mountPath: /app/.uh }
            # 阻断③配套：委派 cgroup v2 子树需可写挂载
            - { name: cgroup, mountPath: /sys/fs/cgroup/uh-plugins }
      volumes:
        - { name: tmp, emptyDir: { medium: Memory, sizeLimit: 128Mi } }
        - { name: state, emptyDir: {} }
        - name: cgroup
          cgroup: { path: uh-plugins, resources: { limits: { pids: 64 } } }
        - name: runtime
          secret:
            secretName: uh-runtime
            items:
              - { key: uh_auth_token, path: uh_auth_token }
              - { key: uh_plugin_trusted_keys, path: uh_plugin_trusted_keys }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uh-llama-index
  namespace: uh-prod
  labels: { app: uh-llama-index, tier: capability }
spec:
  # HPA owns replicas. Apply the HPA to reach the two-replica floor.
  selector:
    matchLabels: { app: uh-llama-index, tier: capability }
  template:
    metadata:
      labels: { app: uh-llama-index, tier: capability }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: Localhost, localhostProfile: uh/seccomp.json }
      volumes:
        - { name: tmp, emptyDir: { medium: Memory, sizeLimit: 128Mi } }
      containers:
        - name: llama-index
          image: ultra-harness/llama-index:0.1.0
          # M3 独立复审 P1：能力容器须真起 MCP HTTP 服务，否则远程路径无对端、
          # 副本增减不影响业务路径。内核侧经 UH_RETRIEVAL_MCP_URL 调用。
          command: ["python", "-m", "kernel.retrieval"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /ready, port: http }
          livenessProbe:
            httpGet: { path: /health, port: http }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          env:
            - { name: UH_MCP_TRANSPORT, value: http }
            - { name: UH_RETRIEVAL_CHROMA, value: "http://chroma:8000" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uh-langgraph
  namespace: uh-prod
  labels: { app: uh-langgraph, tier: capability }
spec:
  selector:
    matchLabels: { app: uh-langgraph, tier: capability }
  template:
    metadata:
      labels: { app: uh-langgraph, tier: capability }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: Localhost, localhostProfile: uh/seccomp.json }
      volumes:
        - { name: tmp, emptyDir: { medium: Memory, sizeLimit: 128Mi } }
      containers:
        - name: langgraph
          image: ultra-harness/langgraph:0.1.0
          # M3 独立复审 P1：同上，编排须作为独立服务承接内核 RPC。
          command: ["python", "-m", "kernel.orchestration"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /ready, port: http }
          livenessProbe:
            httpGet: { path: /health, port: http }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          env:
            - { name: UH_MCP_TRANSPORT, value: http }
            - { name: UH_REDIS_URL, value: "redis://redis:6379" }
            - { name: UH_CHECKPOINT_BACKEND, value: postgres }
            - { name: UH_CHECKPOINT_POSTGRES_URL, value: "postgresql://uh@postgres:5432/uh_checkpoints" }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: uh-runtime, key: DB_PASSWORD }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uh-crewai
  namespace: uh-prod
  labels: { app: uh-crewai, tier: capability }
spec:
  replicas: 0
  selector:
    matchLabels: { app: uh-crewai, tier: capability }
  template:
    metadata:
      labels: { app: uh-crewai, tier: capability }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: Localhost, localhostProfile: uh/seccomp.json }
      volumes:
        - { name: tmp, emptyDir: { medium: Memory, sizeLimit: 128Mi } }
      terminationGracePeriodSeconds: 10
      containers:
        - name: crewai
          image: ultra-harness/crewai:0.1.0
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 0
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          env:
            - { name: UH_LLM_PROVIDER, value: mock }
            - { name: UH_LLM_BASE_URL, value: "https://api.openai.com/v1" }
            - { name: UH_LLM_MODEL, value: gpt-4o-mini }
            - name: UH_LLM_API_KEY
              valueFrom:
                secretKeyRef: { name: uh-runtime, key: UH_LLM_API_KEY }
