services:
  uh-kernel:
    image: ultra-harness/kernel:0.1.0
    build: .
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=128m,mode=1777"]
    security_opt: ["seccomp:./deploy/security/seccomp.json", "no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    ports: ["8080:8080"]
    depends_on:
      redis:
        condition: service_started
      chroma:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      UH_LLM_PROVIDER: ${UH_LLM_PROVIDER:-mock}
      UH_LLM_API_KEY: ${UH_LLM_API_KEY:-}
      UH_LLM_BASE_URL: ${UH_LLM_BASE_URL:-https://api.openai.com/v1}
      UH_LLM_MODEL: ${UH_LLM_MODEL:-gpt-4o-mini}
      UH_REDIS_URL: ${UH_REDIS_URL:-redis://redis:6379}
      UH_RETRIEVAL_BACKEND: ${UH_RETRIEVAL_BACKEND:-chroma}
      UH_RETRIEVAL_CHROMA: ${UH_RETRIEVAL_CHROMA:-http://chroma:8000}
      # M3 独立复审 P1：能力走远程 MCP（原默认进程内，副本增减不影响业务路径）
      UH_RETRIEVAL_MCP_URL: ${UH_RETRIEVAL_MCP_URL:-http://uh-llama-index:8080/mcp}
      UH_ORCHESTRATION_MCP_URL: ${UH_ORCHESTRATION_MCP_URL:-http://uh-langgraph:8080/mcp}
      UH_CHECKPOINT_BACKEND: ${UH_CHECKPOINT_BACKEND:-postgres}
      UH_CHECKPOINT_POSTGRES_URL: ${UH_CHECKPOINT_POSTGRES_URL:-postgresql://uh@postgres:5432/uh_checkpoints}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      UH_LOCAL_MODE: "0"
      UH_AUTH_REQUIRED: "1"
      UH_AUTH_TOKEN_FILE: ${UH_AUTH_TOKEN_FILE:-/run/secrets/uh_auth_token}
      UH_CLIENT_ID_SECRET: ${UH_CLIENT_ID_SECRET:?Set UH_CLIENT_ID_SECRET}
      UH_MEMORY_MASTER_KEY: ${UH_MEMORY_MASTER_KEY:?Set UH_MEMORY_MASTER_KEY}
      UH_PLUGIN_TRUSTED_KEYS_FILE: ${UH_PLUGIN_TRUSTED_KEYS_FILE:-/run/secrets/uh_plugin_trusted_keys}
      UH_PLUGIN_ROOT: /app/.uh/plugins
      UH_SANDBOX_OCI_STRICT: "1"
      UH_COLLABORATION_MODE: compose
    secrets:
      - source: uh_auth_token
        target: ${UH_AUTH_TOKEN_FILE:-/run/secrets/uh_auth_token}
      - source: uh_plugin_trusted_keys
        target: ${UH_PLUGIN_TRUSTED_KEYS_FILE:-/run/secrets/uh_plugin_trusted_keys}
    volumes: ["uh-state:/app/.uh"]
    networks: [default, collaboration]

  uh-llama-index:
    image: ultra-harness/llama-index:0.1.0
    # M3 独立复审 P1：真起 MCP HTTP 服务，否则远程路径无对端
    command: ["python", "-m", "kernel.retrieval"]
    environment:
      UH_MCP_TRANSPORT: http
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=128m,mode=1777"]
    security_opt: ["seccomp:./deploy/security/seccomp.json", "no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    expose: ["8080"]
    depends_on: [chroma]

  uh-langgraph:
    image: ultra-harness/langgraph:0.1.0
    command: ["python", "-m", "kernel.orchestration"]
    environment:
      UH_MCP_TRANSPORT: http
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=128m,mode=1777"]
    security_opt: ["seccomp:./deploy/security/seccomp.json", "no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    expose: ["8080"]
    depends_on: [redis, postgres]

  uh-crewai:
    image: ultra-harness/crewai:0.1.0
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=128m,mode=1777"]
    security_opt: ["seccomp:./deploy/security/seccomp.json", "no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    build:
      context: .
      dockerfile: deploy/crewai/Dockerfile
    expose: ["8080"]
    profiles: ["collaborate"]
    networks: [collaboration]
    environment:
      UH_LLM_PROVIDER: ${UH_LLM_PROVIDER:-mock}
      UH_LLM_API_KEY: ${UH_LLM_API_KEY:-}
      UH_LLM_BASE_URL: ${UH_LLM_BASE_URL:-https://api.openai.com/v1}
      UH_LLM_MODEL: ${UH_LLM_MODEL:-gpt-4o-mini}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/ready', timeout=1).close()"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:7-alpine

  chroma:
    image: chromadb/chroma:latest
    environment:
      CHROMA_PERSIST_PATH: /chroma/db
    volumes: ["chroma-data:/chroma/db"]
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8000;
          printf 'GET /api/v2/heartbeat HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -qm1 '^HTTP/1\.[01] 200 ' <&3
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uh_checkpoints
      POSTGRES_USER: uh
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "uh", "-d", "uh_checkpoints"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  uh-state:
  chroma-data:
  pg-data:

networks:
  collaboration:

secrets:
  uh_auth_token:
    file: ${UH_AUTH_TOKEN_SOURCE:?Set UH_AUTH_TOKEN_SOURCE}
  uh_plugin_trusted_keys:
    file: ${UH_PLUGIN_TRUSTED_KEYS_SOURCE:?Set UH_PLUGIN_TRUSTED_KEYS_SOURCE}
