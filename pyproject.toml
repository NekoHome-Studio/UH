[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uh-kernel"
version = "0.1.0"
description = "UH! 微内核 —— 个人 AI Agent 运行底座"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
uh = "kernel.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "redis>=5", "fakeredis>=2", "pyyaml>=6"]
retrieval = ["pypdf>=5", "chromadb>=0.5", "llama-index-core>=0.11", "llama-index-vector-stores-chroma>=0.3"]

[tool.setuptools]
packages = ["kernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
